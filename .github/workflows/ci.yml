name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Tests only need the core graph + parsing libraries.
          # Avoid pulling Streamlit / Plotly / Matplotlib here -- their
          # transitive deps occasionally break the resolver on older minors.
          pip install "networkx>=3.0" "pyvis>=0.3.1" pytest

      - name: Byte-compile all Python sources
        run: python -m compileall -q launchers samples tests

      - name: Run pytest
        run: python -m pytest tests/ -v

      - name: Regenerate sample DAG outputs (smoke test)
        run: python launchers/generate_sample_outputs.py
